                  message:
                    type: string
                    example: "Xóa dịch vụ thành công"
                  data:
                    nullable: true
                    example: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────────────────
  #  ORDERS ENDPOINTS  (Base: /api/orders)
  # ─────────────────────────────────────────────────────────────────────────────

  /orders:
    get:
      tags: [Orders]
      summary: Lấy danh sách đơn hàng (phân quyền theo role)
      description: |
        **Phân quyền theo role:**
        - **Customer:** Chỉ thấy đơn hàng của chính mình
        - **Staff & Admin:** Thấy tất cả đơn hàng, có thể lọc theo status

        Kết quả được phân trang và sắp xếp theo thời gian tạo (mới nhất trước).
      operationId: getAllOrders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái đơn hàng
          schema:
            type: string
            enum: [received, washing, drying, delivering, completed, cancelled]
        - $ref: '#/components/parameters/PageParam'
        - name: limit
          in: query
          description: Số bản ghi mỗi trang
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Orders]
      summary: Tạo đơn hàng mới
      description: |
        **[Yêu cầu đăng nhập — Customer]**

        Tạo đơn hàng giặt ủi mới. Tổng tiền được tính tự động:
        ```
        totalPrice = service.price × quantity
        ```

        Sau khi tạo thành công:
        - Đơn hàng có trạng thái ban đầu là `received`
        - Mã đơn hàng được tự động sinh (format: `LD-YYYYMMDD-XXXX`)
        - Staff dashboard nhận thông báo real-time qua Socket.io
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              serviceId: "64f1a2b3c4d5e6f7a8b9c0d2"
              quantity: 3.5
              pickupAddress: "123 Lê Lợi, Quận 1, TP.HCM"
              deliveryAddress: "456 Nguyễn Trãi, Quận 5, TP.HCM"
              scheduledPickupTime: "2024-06-21T09:00:00.000Z"
              note: "Quần áo màu tối, giặt riêng. Tránh nhiệt cao."
      responses:
        '201':
          description: Tạo đơn hàng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tạo đơn hàng thành công"
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '400':
          description: Dữ liệu không hợp lệ hoặc dịch vụ không tồn tại/đã ngừng hoạt động
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Lấy chi tiết một đơn hàng (kèm ảnh)
      description: |
        Trả về đầy đủ thông tin đơn hàng bao gồm:
        - Thông tin đơn hàng (populate customer, staff, service)
        - Lịch sử trạng thái (statusHistory)
        - Ghi chú nhân viên (staffNotes)
        - Danh sách ảnh nhận/giao đồ (images)

        **Phân quyền:**
        - Customer chỉ xem được đơn của mình
        - Staff/Admin xem được tất cả
      operationId: getOrderById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Lấy chi tiết thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Customer cố xem đơn hàng của người khác
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Orders]
      summary: Hủy đơn hàng
      description: |
        **Phân quyền hủy đơn:**
        - **Customer:** Chỉ hủy được đơn của mình và khi `status = received`
        - **Admin:** Hủy bất kỳ đơn nào (trừ đơn đã `completed`)

        Khi hủy, `statusHistory` sẽ được cập nhật với lý do hủy.
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: reason
          in: query
          description: Lý do hủy đơn (optional)
          schema:
            type: string
            example: "Khách hàng đổi ý"
      responses:
        '200':
          description: Hủy đơn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Hủy đơn hàng thành công"
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '400':
          description: Không thể hủy (đơn đã completed hoặc đã cancelled)
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    put:
      tags: [Orders]
      summary: "[Staff/Admin] Cập nhật trạng thái đơn hàng"
      description: |
        **[Yêu cầu role: staff hoặc admin]**

        Cập nhật trạng thái đơn hàng theo đúng luồng:
        ```
        received → washing → drying → delivering → completed
        ```
        Bất kỳ trạng thái nào cũng có thể chuyển sang `cancelled` (trừ `completed`).

        > ⚠️ Nếu chuyển sang trạng thái không hợp lệ, server trả về lỗi 400 với
        > danh sách trạng thái hợp lệ tiếp theo.
      operationId: updateOrderStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            example:
              status: "washing"
              note: "Bắt đầu giặt lúc 9h sáng, máy giặt số 3"
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật trạng thái đơn hàng thành công → \"washing\""
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '400':
          description: Trạng thái không hợp lệ hoặc vi phạm luồng trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Không thể chuyển từ trạng thái \"completed\" sang \"washing\". Các trạng thái hợp lệ tiếp theo: không có"
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/images:
    post:
      tags: [Orders]
      summary: "[Staff/Admin] Upload ảnh nhận/giao đồ"
      description: |
        **[Yêu cầu role: staff hoặc admin]**

        Upload ảnh chụp tại thời điểm nhận đồ từ khách (`pickup`) hoặc giao đồ lại (`delivery`).

        **Ràng buộc trạng thái:**
        - `imageType = pickup` → đơn phải ở trạng thái `received`
        - `imageType = delivery` → đơn phải ở trạng thái `delivering`

        Ảnh được upload lên Cloudinary. Hỗ trợ upload nhiều ảnh cùng lúc (tối đa 5 ảnh).
      operationId: uploadOrderImages
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images, imageType]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Các file ảnh (jpg, png, webp). Tối đa 5 ảnh, mỗi ảnh tối đa 10MB
                imageType:
                  type: string
                  enum: [pickup, delivery]
                  description: Loại ảnh
      responses:
        '201':
          description: Upload ảnh thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Upload ảnh thành công"
                  data:
                    type: object
                    properties:
                      images:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{id}/assign:
    put:
      tags: [Admin — Staff Management]
      summary: "[Admin] Phân công nhân viên cho đơn hàng"
      description: |
        **[Yêu cầu role: admin]**

        Gán một nhân viên (staff) cho đơn hàng.
        Dùng để điều phối công việc trong nội bộ.
      operationId: assignStaff
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignStaffRequest'
            example:
              staffId: "64f1a2b3c4d5e6f7a8b9c0d5"
      responses:
        '200':
          description: Phân công thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Phân công nhân viên thành công"
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────────────────
  #  PAYMENTS ENDPOINTS  (Base: /api/payments)
  # ─────────────────────────────────────────────────────────────────────────────

  /payments/create:
    post:
      tags: [Payments]
      summary: Tạo giao dịch thanh toán
      description: |
        Tạo giao dịch thanh toán cho đơn hàng.

        **Các phương thức hỗ trợ:**
        - `cash`: Thanh toán tiền mặt khi giao đồ. Response không có `paymentUrl`.
        - `vnpay`: Thanh toán online qua VNPay. Response có `paymentUrl` → FE redirect khách tới URL đó.
        - `momo`: Thanh toán qua MoMo. Response có `paymentUrl`.

        **Luồng VNPay:**
        1. FE gọi `POST /payments/create` với `method: "vnpay"`
        2. Server tạo Payment record và trả về `paymentUrl`
        3. FE redirect khách đến `paymentUrl`
        4. VNPay callback về `GET /payments/vnpay-return` (server xử lý tự động)
        5. FE poll `GET /payments/order/{orderId}` để kiểm tra kết quả
      operationId: createPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              orderId: "64f1a2b3c4d5e6f7a8b9c0d3"
              method: "vnpay"
      responses:
        '201':
          description: Tạo giao dịch thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tạo giao dịch thanh toán thành công"
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: '#/components/schemas/Payment'
              examples:
                vnpay:
                  summary: Thanh toán VNPay
                  value:
                    success: true
                    message: "Tạo giao dịch thanh toán thành công"
                    data:
                      payment:
                        _id: "64f1a2b3c4d5e6f7a8b9c0d6"
                        order: "64f1a2b3c4d5e6f7a8b9c0d3"
                        amount: 87500
                        method: "vnpay"
                        status: "pending"
                        paymentUrl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?vnp_Amount=8750000&vnp_TxnRef=LD-20240620-0001&..."
                        paidAt: null
                cash:
                  summary: Thanh toán tiền mặt
                  value:
                    success: true
                    message: "Tạo giao dịch thanh toán thành công"
                    data:
                      payment:
                        _id: "64f1a2b3c4d5e6f7a8b9c0d7"
                        order: "64f1a2b3c4d5e6f7a8b9c0d3"
                        amount: 87500
                        method: "cash"
                        status: "pending"
                        paymentUrl: null
                        paidAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/order/{orderId}:
    get:
      tags: [Payments]
      summary: Lấy thông tin thanh toán theo đơn hàng
      description: |
        Lấy chi tiết giao dịch thanh toán liên kết với một đơn hàng.
        FE dùng endpoint này để kiểm tra kết quả sau khi khách hoàn tất thanh toán VNPay/MoMo.
      operationId: getPaymentByOrder
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID của đơn hàng
          schema:
            type: string
            example: "64f1a2b3c4d5e6f7a8b9c0d3"
      responses:
        '200':
          description: Lấy thông tin thanh toán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Lấy thông tin thanh toán thành công"
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/vnpay-return:
    get:
      tags: [Payments]
      summary: VNPay Callback URL (Server tự xử lý — FE không gọi trực tiếp)
      description: |
        Endpoint callback từ VNPay sau khi khách hoàn tất thanh toán.

        > 🤖 **FE không cần gọi endpoint này.** VNPay server tự redirect về đây.
        > Sau khi server xử lý xong, trang sẽ redirect về FE thành công/thất bại.

        **Không yêu cầu JWT** vì VNPay gọi từ server của họ.
      operationId: vnpayReturn
      security: []
      parameters:
        - name: vnp_ResponseCode
          in: query
          schema:
            type: string
          description: Mã kết quả từ VNPay ("00" = thành công)
        - name: vnp_TxnRef
          in: query
          schema:
            type: string
          description: Mã đơn hàng (orderCode)
        - name: vnp_Amount
          in: query
          schema:
            type: string
          description: Số tiền thanh toán (×100)
      responses:
        '302':
          description: Redirect về trang FE (thành công hoặc thất bại)

  # ─────────────────────────────────────────────────────────────────────────────
  #  ADMIN ENDPOINTS  (Base: /api/admin)
  # ─────────────────────────────────────────────────────────────────────────────

  /admin/dashboard:
    get:
      tags: [Admin — Dashboard & Orders]
      summary: "[Admin/Staff] Xem thống kê Dashboard"
      description: |
        **[Yêu cầu role: admin hoặc staff]**

        Trả về thống kê tổng quan cho trang Admin Dashboard:
        - Số đơn và doanh thu trong ngày hôm nay
        - Số đơn theo từng trạng thái
        - Doanh thu theo từng tháng trong năm
        - 10 đơn hàng gần nhất
      operationId: getDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thống kê thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/orders:
    get:
      tags: [Admin — Dashboard & Orders]
      summary: "[Admin/Staff] Xem và lọc tất cả đơn hàng"
      description: |
        **[Yêu cầu role: admin hoặc staff]**

        Lấy danh sách toàn bộ đơn hàng trong hệ thống với bộ lọc nâng cao.

        **Hỗ trợ lọc theo:**
        - `status`: Trạng thái (có thể nhiều giá trị cách dấu phẩy: `?status=washing,drying`)
        - `dateFrom` / `dateTo`: Khoảng thời gian tạo đơn
        - `search`: Tìm theo mã đơn hàng (orderCode), vd: `?search=LD-20240620`
        - `staffId`: Lọc theo nhân viên phụ trách
        - `page`, `limit`, `sortBy`, `sortOrder`: Phân trang và sắp xếp
      operationId: adminGetAllOrders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: "Lọc theo trạng thái. Có thể truyền nhiều giá trị: ?status=washing,drying"
          schema:
            type: string
            example: "washing"
        - name: dateFrom
          in: query
          description: Lọc đơn từ ngày (ISO date, ví dụ 2024-06-01)
          schema:
            type: string
            format: date
            example: "2024-06-01"
        - name: dateTo
          in: query
          description: Lọc đơn đến ngày (ISO date)
          schema:
            type: string
            format: date
            example: "2024-06-30"
        - name: search
          in: query
          description: Tìm kiếm theo mã đơn hàng (orderCode)
          schema:
            type: string
            example: "LD-20240620"
        - name: staffId
          in: query
          description: Lọc theo ID nhân viên phụ trách
          schema:
            type: string
            example: "64f1a2b3c4d5e6f7a8b9c0d5"
        - name: sortBy
          in: query
          description: Field dùng để sắp xếp
          schema:
            type: string
            enum: [createdAt, totalPrice, status]
            default: createdAt
        - name: sortOrder
          in: query
          description: Chiều sắp xếp
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/PageParam'
        - name: limit
          in: query
          description: Số bản ghi mỗi trang
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lấy danh sách đơn hàng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/orders/{id}:
    get:
      tags: [Admin — Dashboard & Orders]
      summary: "[Admin/Staff] Xem chi tiết đơn hàng (đầy đủ)"
      description: |
        **[Yêu cầu role: admin hoặc staff]**

        Trả về toàn bộ thông tin đơn hàng bao gồm:
        - Thông tin khách hàng đầy đủ (tên, email, SĐT, địa chỉ)
        - Thông tin nhân viên phụ trách
        - Lịch sử trạng thái (statusHistory) đầy đủ
        - Tất cả ghi chú nhân viên (staffNotes)
        - Ghi chú admin (adminNote)
        - Toàn bộ ảnh nhận/giao đồ
      operationId: adminGetOrderDetail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Lấy chi tiết thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders/{id}/status:
    patch:
      tags: [Admin — Dashboard & Orders]
      summary: "[Admin/Staff] Cập nhật trạng thái đơn hàng"
      description: |
        **[Yêu cầu role: admin hoặc staff]**

        > ℹ️ **Lưu ý kỹ thuật:** Endpoint này dùng **PATCH** (không phải PUT) vì
        > chỉ cập nhật một field `status`, không phải toàn bộ resource.

        Cập nhật trạng thái đơn hàng theo luồng hợp lệ. Real-time update được
        gửi tới khách hàng và các staff khác qua **Socket.io** ngay sau khi cập nhật.

        **Socket event:** `order:statusUpdated` với payload:
        ```json
        {
          "orderId": "64f1a...",
          "status": "washing",
          "note": "Bắt đầu giặt",
          "updatedBy": { "name": "Trần Thị Bảo", "role": "staff" }
        }
        ```
      operationId: adminUpdateOrderStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            examples:
              start_washing:
                summary: Bắt đầu giặt
                value:
                  status: "washing"
                  note: "Bắt đầu giặt lúc 9h sáng"
              start_drying:
                summary: Chuyển sang sấy
                value:
                  status: "drying"
                  note: "Giặt xong, đang sấy"
              out_for_delivery:
                summary: Bắt đầu giao hàng
                value:
                  status: "delivering"
                  note: "Shipper Minh đang trên đường giao"
              complete:
                summary: Hoàn thành đơn
                value:
                  status: "completed"
                  note: "Đã giao thành công lúc 15h30"
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật trạng thái đơn hàng thành công → \"washing\""
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '400':
          description: Trạng thái không hợp lệ hoặc vi phạm luồng trạng thái
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders/{id}/staff-notes:
    post:
      tags: [Admin — Dashboard & Orders]
      summary: "[Admin/Staff] Thêm ghi chú nhân viên vào đơn hàng"
      description: |
        **[Yêu cầu role: admin hoặc staff]**

        Thêm một ghi chú mới vào danh sách `staffNotes` của đơn hàng.
        Ghi chú được **append** (không ghi đè ghi chú cũ).

        Ví dụ sử dụng:
        - "Áo sơ mi bị ố vàng nhẹ, đã dùng tẩy chuyên dụng"
        - "Khách hẹn giao sau 5h chiều"
        - "Quần jean màu đậm, giặt riêng"
      operationId: addStaffNote
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStaffNoteRequest'
            example:
              content: "Áo sơ mi bị ố vàng nhẹ, đã dùng tẩy chuyên dụng. Kết quả tốt."
      responses:
        '201':
          description: Thêm ghi chú thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Thêm ghi chú thành công"
                  data:
                    type: object
                    properties:
                      staffNotes:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/orders/{id}/assign:
    put:
      tags: [Admin — Staff Management]
      summary: "[Admin Only] Phân công nhân viên cho đơn hàng"
      description: |
        **[Yêu cầu role: admin — Staff không được phép]**

        Gán nhân viên phụ trách cho đơn hàng. Lấy danh sách nhân viên từ
        `GET /admin/staff` để hiển thị dropdown chọn nhân viên.
      operationId: adminAssignStaff
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignStaffRequest'
            example:
              staffId: "64f1a2b3c4d5e6f7a8b9c0d5"
      responses:
        '200':
          description: Phân công thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Phân công nhân viên thành công"
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders/{id}/admin-note:
    put:
      tags: [Admin — Dashboard & Orders]
      summary: "[Admin Only] Cập nhật ghi chú Admin"
      description: |
        **[Yêu cầu role: admin — Staff không được phép]**

        Cập nhật ghi chú nội bộ của Admin cho đơn hàng (overwrite — chỉ 1 ghi chú tại 1 thời điểm).
        Truyền chuỗi rỗng `""` để xóa ghi chú.

        Ví dụ sử dụng:
        - "VIP customer — ưu tiên xử lý"
        - "Đã xác nhận qua điện thoại lúc 10h sáng"
        - "Miễn phí ship do lần đầu tiên dùng dịch vụ"
      operationId: updateAdminNote
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminNoteRequest'
            examples:
              set_note:
                summary: Đặt ghi chú mới
                value:
                  adminNote: "VIP customer — ưu tiên xử lý"
              clear_note:
                summary: Xóa ghi chú (truyền chuỗi rỗng)
                value:
                  adminNote: ""
      responses:
        '200':
          description: Cập nhật ghi chú thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật ghi chú admin thành công"
                  data:
                    type: object
                    properties:
                      adminNote:
                        type: string
                        example: "VIP customer — ưu tiên xử lý"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/staff:
    get:
      tags: [Admin — Staff Management]
      summary: "[Admin Only] Lấy danh sách nhân viên"
      description: |
        **[Yêu cầu role: admin — Staff không được phép xem]**

        Lấy danh sách nhân viên đang hoạt động (`isActive = true`, `role = staff`).
        Dùng để hiển thị dropdown chọn nhân viên khi phân công đơn hàng.
      operationId: getStaffList
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Tìm kiếm theo tên, email hoặc số điện thoại
          schema:
            type: string
            example: "Nguyễn"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lấy danh sách nhân viên thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Lấy danh sách nhân viên thành công"
                  data:
                    type: object
                    properties:
                      staff:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                success: true
                message: "Lấy danh sách nhân viên thành công"
                data:
                  staff:
                    - _id: "64f1a2b3c4d5e6f7a8b9c0d5"
                      name: "Trần Thị Bảo"
                      email: "tranthibao@laundry.vn"
                      phone: "0987654321"
                      role: "staff"
                      isActive: true
                    - _id: "64f1a2b3c4d5e6f7a8b9c0d8"
                      name: "Lê Văn Cường"
                      email: "levanncuong@laundry.vn"
                      phone: "0911222333"
                      role: "staff"
                      isActive: true
                pagination:
                  total: 8
                  page: 1
                  limit: 20
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
