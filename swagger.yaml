        **[Yêu cầu role: admin]**

        Xóa vĩnh viễn gói dịch vụ khỏi hệ thống.

        > ⚠️ **Lưu ý:** Nên cân nhắc dùng `PUT /services/{id}` với `isActive: false`
        > thay vì xóa hẳn, để không ảnh hưởng đến lịch sử đơn hàng đã có.
      operationId: deleteService
